<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="نَسّق NASSQ لتنظيم حياتك اليومية والدراسة والعمل والصحة والوجبات والأهداف." />
    <meta name="theme-color" content="#58751b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>نَسّق — جدولك وحياتك بترتيب</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (new URLSearchParams(window.location.search).get("template") !== "blank") {
        const blankUrl = new URL(window.location.href);
        blankUrl.searchParams.set("template", "blank");
        window.history.replaceState(null, "", blankUrl.pathname + blankUrl.search + blankUrl.hash);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
