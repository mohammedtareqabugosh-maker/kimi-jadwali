name: Build site to root
on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site-root
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: source
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: corepack enable && corepack prepare pnpm@10.18.3 --activate && pnpm install --no-frozen-lockfile && pnpm run build
      - name: Replace root with the built site
        run: |
          rm -rf assets
          rm -f index.html blank.html
          cp -R source/dist/. .
      - name: Commit built site
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish built site to root [skip ci]"
          git push origin HEAD:main
